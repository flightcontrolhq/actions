name: Setup Google Cloud SDK
description: Install Google Cloud SDK with gcloud, gsutil, and bq

inputs:
  gcloud-version:
    description: Google Cloud SDK version to install (use 'latest' for latest version)
    required: false
    default: "latest"

dependencyTemplates:
  - name: gcloud
    package: google-cloud-sdk
    installMethod: install-script
    checkBinary: gcloud
    installScript:
      url: https://sdk.cloud.google.com
      args: --disable-prompts --install-dir=/usr/local
    postInstall:
      # Symlink onto the default PATH rather than `export PATH`, which does not
      # persist across steps (each runs in its own login shell). This also lets
      # the gcloud config commands below find the binary.
      - sudo ln -sf /usr/local/google-cloud-sdk/bin/gcloud /usr/local/bin/gcloud
      - sudo ln -sf /usr/local/google-cloud-sdk/bin/gsutil /usr/local/bin/gsutil
      - sudo ln -sf /usr/local/google-cloud-sdk/bin/bq /usr/local/bin/bq
      - gcloud config set core/disable_usage_reporting true
      - gcloud config set component_manager/disable_update_check true

instructions: []
